name: Release (Linux, macOS, Windows)
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Determine Version
        env:
          EVENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
            git fetch --no-tags --force origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
            EVENT_COMMIT="$(git rev-parse "${EVENT_SHA}^{commit}")"
            if [ "$(git rev-parse HEAD)" != "$EVENT_COMMIT" ] || \
               [ "$(git rev-parse "refs/tags/${VERSION}^{commit}")" != "$EVENT_COMMIT" ]; then
              echo "::error::Tag '$VERSION' no longer points to the release event commit"
              exit 1
            fi
          else
            VERSION=$(git describe --tags --always)
          fi
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Version '$VERSION' is not safe for artifact names"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-arm64-$VERSION
      - name: Generate checksums
        run: sha256sum new-api-* > checksums-linux.txt

      - name: Attest Linux binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: new-api-*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-build
          path: |
            new-api-*
            checksums-linux.txt

  macos:
    name: macOS Release
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Determine Version
        env:
          EVENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
            git fetch --no-tags --force origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
            EVENT_COMMIT="$(git rev-parse "${EVENT_SHA}^{commit}")"
            if [ "$(git rev-parse HEAD)" != "$EVENT_COMMIT" ] || \
               [ "$(git rev-parse "refs/tags/${VERSION}^{commit}")" != "$EVENT_COMMIT" ]; then
              echo "::error::Tag '$VERSION' no longer points to the release event commit"
              exit 1
            fi
          else
            VERSION=$(git describe --tags --always)
          fi
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Version '$VERSION' is not safe for artifact names"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Backend
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-macos-amd64-$VERSION
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-macos-arm64-$VERSION
      - name: Generate checksums
        run: shasum -a 256 new-api-macos-* > checksums-macos.txt

      - name: Attest macOS binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: new-api-macos-*

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build
          path: |
            new-api-macos-*
            checksums-macos.txt

  windows:
    name: Windows Release
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Determine Version
        env:
          EVENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="$REF_NAME"
            git fetch --no-tags --force origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
            EVENT_COMMIT="$(git rev-parse "${EVENT_SHA}^{commit}")"
            if [ "$(git rev-parse HEAD)" != "$EVENT_COMMIT" ] || \
               [ "$(git rev-parse "refs/tags/${VERSION}^{commit}")" != "$EVENT_COMMIT" ]; then
              echo "::error::Tag '$VERSION' no longer points to the release event commit"
              exit 1
            fi
          else
            VERSION=$(git describe --tags --always)
          fi
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Version '$VERSION' is not safe for artifact names"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api.exe
          cp new-api.exe "new-api-$VERSION.exe"
      - name: Generate checksums
        run: sha256sum new-api-*.exe > checksums-windows.txt

      - name: Attest Windows backend binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: new-api-*.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-backend-build
          path: |
            new-api-*.exe
            checksums-windows.txt

      - name: Setup Node.js for Electron
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Update Electron version
        run: |
          cd electron
          ELECTRON_VERSION=${VERSION#v}
          if [[ $ELECTRON_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
            REST=${BASH_REMATCH[4]}
            ELECTRON_VERSION="$MAJOR.$MINOR.$PATCH$REST"
          fi
          npm version "$ELECTRON_VERSION" --no-git-tag-version --allow-same-version

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      - name: Build Electron app
        run: |
          cd electron
          npm run build:win

      - name: Stage Electron release artifacts
        run: |
          mkdir release-electron
          cp electron/dist/*.exe release-electron/
          cd release-electron
          sha256sum *.exe > checksums-electron-windows.txt

      - name: Attest Electron installers
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-electron/*.exe

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-electron-build
          path: release-electron/*

  release:
    name: Publish complete release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Check out release event commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download backend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Revalidate release tag
        id: release_kind
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin "refs/tags/${EVENT_TAG}:refs/tags/${EVENT_TAG}"
          EVENT_COMMIT="$(git rev-parse "${EVENT_SHA}^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$EVENT_COMMIT" ] || \
             [ "$(git rev-parse "refs/tags/${EVENT_TAG}^{commit}")" != "$EVENT_COMMIT" ]; then
            echo "::error::Tag '$EVENT_TAG' moved during the build; refusing release publication"
            exit 1
          fi
          if [[ "$EVENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=legacy" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select release notes
        id: release_notes
        env:
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          NOTES_PATH=".github/release-notes/${EVENT_TAG}.md"
          if [ ! -f "$NOTES_PATH" ]; then
            NOTES_PATH="$RUNNER_TEMP/release-notes.md"
            : > "$NOTES_PATH"
          fi
          echo "path=${NOTES_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ steps.release_kind.outputs.prerelease }}
          make_latest: ${{ steps.release_kind.outputs.make_latest }}
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            linux-build/*
            macos-build/*
            windows-backend-build/*
            windows-electron-build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish fully populated Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin "refs/tags/${EVENT_TAG}:refs/tags/${EVENT_TAG}"
          EVENT_COMMIT="$(git rev-parse "${EVENT_SHA}^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$EVENT_COMMIT" ] || \
             [ "$(git rev-parse "refs/tags/${EVENT_TAG}^{commit}")" != "$EVENT_COMMIT" ]; then
            echo "::error::Tag '$EVENT_TAG' moved during artifact upload; leaving the Release as a draft"
            exit 1
          fi
          gh release edit "$EVENT_TAG" --draft=false
