name: Publish Docker image (Multi-arch)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v0.10.8-alpha.3)'
        required: true
        type: string

concurrency:
  group: docker-version-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  classify_latest:
    name: Classify latest promotion
    runs-on: ubuntu-latest
    outputs:
      promote: ${{ steps.classify.outputs.promote }}
    permissions:
      contents: read
    steps:
      - name: Check out tag history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify stable tag
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          echo "promote=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != "push" ] || [ "$REF_TYPE" != "tag" ] || \
             ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          git fetch --force --tags origin
          LATEST_STABLE=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ "$REF_NAME" = "$LATEST_STABLE" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi

  resolve_source:
    name: Resolve immutable tag source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag once for every architecture
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_REF_TYPE" = "tag" ]; then
            TAG="$EVENT_REF_NAME"
          else
            echo "::error::Docker publishing requires a tag push or workflow_dispatch tag input"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tag '$TAG' is not a valid container tag"
            exit 1
          fi
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "$EVENT_NAME" = "push" ]; then
            EVENT_COMMIT="$(git rev-parse "${EVENT_SHA}^{commit}")"
            if [ "$TAG_COMMIT" != "$EVENT_COMMIT" ]; then
              echo "::error::Tag '$TAG' moved after the push event; refusing to publish a different commit"
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: [resolve_source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve_source.outputs.commit }}
          persist-credentials: false

      - name: Resolve tag & write VERSION
        id: version
        env:
          SOURCE_COMMIT: ${{ needs.resolve_source.outputs.commit }}
          TAG: ${{ needs.resolve_source.outputs.tag }}
        run: |
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT_COMMIT" != "$SOURCE_COMMIT" ]; then
            echo "::error::Checked out commit does not match the resolved source for tag '$TAG'"
            exit 1
          fi
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "$SOURCE_COMMIT" ]; then
            echo "::error::Tag '$TAG' moved after source resolution; refusing mixed-commit architecture images"
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/nsuanningmeng/lemonhub
          tags: |
            type=raw,value=${{ needs.resolve_source.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve_source.outputs.commit }}
            org.opencontainers.image.version=${{ needs.resolve_source.outputs.tag }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/nsuanningmeng/lemonhub,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes ghcr.io/nsuanningmeng/lemonhub@${{ steps.build.outputs.digest }}

      - name: Record immutable architecture digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build returned an invalid image digest"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/image-digests"
          touch "$RUNNER_TEMP/image-digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload immutable architecture digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Image summary
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/nsuanningmeng/lemonhub@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_version_manifest:
    name: Create versioned multi-arch manifest
    needs: [resolve_source, build_single_arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out resolved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve_source.outputs.commit }}
          persist-credentials: false

      - name: Set version
        env:
          RESOLVED_TAG: ${{ needs.resolve_source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve_source.outputs.commit }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo "::error::Checked out commit does not match the resolved source for tag '$RESOLVED_TAG'"
            exit 1
          fi
          git fetch --no-tags --force origin "refs/tags/${RESOLVED_TAG}:refs/tags/${RESOLVED_TAG}"
          if [ "$(git rev-parse "refs/tags/${RESOLVED_TAG}^{commit}")" != "$SOURCE_COMMIT" ]; then
            echo "::error::Tag '$RESOLVED_TAG' moved after the architecture builds; refusing manifest publication"
            exit 1
          fi
          echo "TAG=${RESOLVED_TAG}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download immutable architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true

      - name: Create & push versioned manifest
        env:
          SOURCE_COMMIT: ${{ needs.resolve_source.outputs.commit }}
        run: |
          mapfile -t DIGESTS < <(find "$RUNNER_TEMP/image-digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#DIGESTS[@]}" -ne 2 ]; then
            echo "::error::Expected exactly two architecture digests, found ${#DIGESTS[@]}"
            exit 1
          fi
          SOURCES=()
          for digest in "${DIGESTS[@]}"; do
            if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid architecture digest artifact '$digest'"
              exit 1
            fi
            SOURCES+=("ghcr.io/nsuanningmeng/lemonhub@sha256:${digest}")
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=${SOURCE_COMMIT}" \
            --annotation "index:org.opencontainers.image.version=${TAG}" \
            -t ghcr.io/nsuanningmeng/lemonhub:${TAG} \
            "${SOURCES[@]}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign versioned manifest with cosign
        run: |
          VERSION_DIGEST=$(docker buildx imagetools inspect ghcr.io/nsuanningmeng/lemonhub:${TAG} --format '{{.Manifest.Digest}}')
          cosign sign --yes ghcr.io/nsuanningmeng/lemonhub@${VERSION_DIGEST}

      - name: Manifest summary
        run: |
          echo "### Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ghcr.io/nsuanningmeng/lemonhub:${TAG} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  promote_latest:
    name: Promote newest stable image to latest
    needs: [classify_latest, resolve_source, build_single_arch, create_version_manifest]
    if: needs.classify_latest.outputs.promote == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-latest-promotion
      cancel-in-progress: false

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out tag history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve_source.outputs.commit }}
          persist-credentials: false

      - name: Confirm newest stable tag
        id: latest
        env:
          RESOLVED_TAG: ${{ needs.resolve_source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve_source.outputs.commit }}
        run: |
          EVENT_TAG="$RESOLVED_TAG"
          if ! [[ "$EVENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping latest promotion for non-stable tag $EVENT_TAG"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo "::error::Checked out commit does not match the resolved source for tag '$EVENT_TAG'"
            exit 1
          fi
          git fetch --force --tags origin
          if [ "$(git rev-parse "refs/tags/${EVENT_TAG}^{commit}")" != "$SOURCE_COMMIT" ]; then
            echo "::error::Tag '$EVENT_TAG' moved after source resolution; refusing latest promotion"
            exit 1
          fi
          LATEST_STABLE=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$LATEST_STABLE" ]; then
            echo "::error::No stable semantic-version tag exists"
            exit 1
          fi
          if [ "$EVENT_TAG" != "$LATEST_STABLE" ]; then
            echo "Skipping latest promotion: $EVENT_TAG is not newest stable tag $LATEST_STABLE"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "TAG=$EVENT_TAG" >> "$GITHUB_ENV"
          echo "promote=true" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.latest.outputs.promote == 'true'
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote immutable version manifest
        if: steps.latest.outputs.promote == 'true'
        run: |
          VERSION_DIGEST=$(docker buildx imagetools inspect ghcr.io/nsuanningmeng/lemonhub:${TAG} --format '{{.Manifest.Digest}}')
          for attempt in {1..5}; do
            if docker buildx imagetools create \
                 -t ghcr.io/nsuanningmeng/lemonhub:latest \
                 ghcr.io/nsuanningmeng/lemonhub:${TAG}; then
              LATEST_DIGEST=$(docker buildx imagetools inspect ghcr.io/nsuanningmeng/lemonhub:latest --format '{{.Manifest.Digest}}')
              if [ "$VERSION_DIGEST" = "$LATEST_DIGEST" ]; then
                exit 0
              fi
            fi
            echo "Latest manifest verification failed ($attempt/5); retrying atomic promotion..."
            sleep 10
          done
          echo "::error::Latest image could not be promoted to the immutable version digest"
          exit 1

      - name: Install cosign
        if: steps.latest.outputs.promote == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign latest manifest with cosign
        if: steps.latest.outputs.promote == 'true'
        run: |
          LATEST_DIGEST=$(docker buildx imagetools inspect ghcr.io/nsuanningmeng/lemonhub:latest --format '{{.Manifest.Digest}}')
          cosign sign --yes ghcr.io/nsuanningmeng/lemonhub@${LATEST_DIGEST}
