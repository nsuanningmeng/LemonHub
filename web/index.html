<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lemonhub-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>LemonHub</title>
    <meta name="title" content="LemonHub" />
    <meta
      name="description"
      content="LemonHub — one workspace for models, API access, and AI usage."
    />
    <meta name="keywords" content="AI API, API gateway, LLM proxy" />

    <meta name="theme-color" content="#f7f7f3" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        var isHome = window.location.pathname === '/'
        document.documentElement.toggleAttribute('data-home', isHome)
        document.documentElement.classList.add(theme)
        var background = isHome
          ? { light: '#f7f7f3', dark: '#151e2d' }
          : { light: '#f8f9f6', dark: '#181d19' }
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', background[theme])
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
